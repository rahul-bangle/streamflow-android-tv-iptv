<!-- Script to simulate D-Pad TV Navigation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.channel-card');
            
            // Allow mouse hover to simulate focus for web preview purposes
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    // Remove focus from all
                    cards.forEach(c => c.classList.remove('focused'));
                    // Add to current
                    card.classList.add('focused');
                    card.focus();
                });
            });

            // Basic keyboard navigation simulation (Up/Down/Left/Right)
            // Simplified for prototype
            document.addEventListener('keydown', (e) => {
                const active = document.activeElement;
                if(!active.classList.contains('channel-card')) return;
                
                const idx = Array.from(cards).indexOf(active);
                let nextIdx = idx;

                const cols = window.innerWidth >= 1280 ? 5 : 
                             window.innerWidth >= 1024 ? 4 : 
                             window.innerWidth >= 768 ? 3 : 2;

                if(e.key === 'ArrowRight') nextIdx = Math.min(idx + 1, cards.length - 1);
                if(e.key === 'ArrowLeft') nextIdx = Math.max(idx - 1, 0);
                if(e.key === 'ArrowDown') nextIdx = Math.min(idx + cols, cards.length - 1);
                if(e.key === 'ArrowUp') nextIdx = Math.max(idx - cols, 0);

                if(nextIdx !== idx) {
                    e.preventDefault();
                    cards.forEach(c => c.classList.remove('focused'));
                    cards[nextIdx].classList.add('focused');
                    cards[nextIdx].focus();
                    cards[nextIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
            
            // Initial focus
            if(cards.length > 0) {
                cards[0].focus();
            }
        });
    </script>
</body></html>
