<!DOCTYPE html>

<html class="dark" lang="en"><head>

<title>StreamFlow - Live TV Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "spacing": {
                        "sidebar-width-expanded": "320px",
                        "safe-margin-y": "60px",
                        "safe-margin-x": "80px",
                        "gutter": "24px",
                        "sidebar-width-collapsed": "100px",
                        "card-gap": "32px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],

                    "fontSize": {

<style>
        body { margin: 0; overflow: hidden; background-color: #121212; }
        .glass-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .focus-ring {
            box-shadow: 0 0 0 4px #e50914, 0 0 20px rgba(229, 9, 20, 0.5);
            transform: scale(1.05);
            transition: all 0.2s ease-out;
        }
    </style>

<body class="text-on-surface w-screen h-screen relative">
<!-- Video Background Placeholder -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A high-quality, cinematic still from a dramatic breaking news broadcast. The scene shows an empty, modern anchor desk illuminated by moody, high-contrast studio lighting with cool blue backlights and warm key lights. The background features a large, blurred digital world map, adding depth to the cinematic composition." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCvq1O1eh9y7efGCpoHMqGOL_pYB0gShMJGoG9uitOtMJ5LRQHMZIA4OdmGwLoiFkQNyfj-dEcVkgrdcRqTDlfJFxa8k_RR8TKAW0VRQ6LuVoftCKV8mCQeEoDA9_JcLuCR0S-TkU5zCVjmC8CCi2f7tkrRzl8PtRDrHS1Y9btA_WGTSGDiEBhHo8MzNXL05rOUT6h32z1cITAj0s8YQZGAD9vgdTRnKGmnY16k8Hqh6WV7_QoKl1xh3mcKV8rqCPsPI7fdPo0laYU');"></div>
<!-- Top Info Overlay -->
<div class="absolute top-safe-margin-y right-safe-margin-x z-20 flex items-center gap-4 text-on-surface drop-shadow-md">
<span class="font-label-lg text-label-lg bg-surface-container/50 px-4 py-2 rounded-full backdrop-blur-md">8:45 PM</span>
<div class="flex items-center gap-1 bg-surface-container/50 px-3 py-2 rounded-full backdrop-blur-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
</div>
</div>
<!-- Right-aligned Quick Switch Channel List -->
<div class="absolute right-0 top-1/2 -translate-y-1/2 z-20 pr-safe-margin-x">
<div class="glass-overlay rounded-xl p-4 flex flex-col gap-4 border border-surface-bright/20 w-64">
<div class="font-label-lg text-label-lg text-tertiary mb-2">Quick Switch</div>
<div class="flex items-center gap-4 p-3 rounded-lg bg-surface-bright/10 hover:bg-surface-bright/30 transition-colors cursor-pointer group">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center font-bold text-lg border border-surface-bright/30">ALJ</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">Al Jazeera</span>
<span class="text-xs text-tertiary">Global News</span>
</div>
</div>
<div class="flex items-center gap-4 p-3 rounded-lg bg-surface-bright/10 hover:bg-surface-bright/30 transition-colors cursor-pointer group border-l-4 border-primary-container">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center font-bold text-lg border border-primary-container">GNN</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface font-bold text-primary-container">Global News Net</span>
<span class="text-xs text-tertiary">Evening News</span>
</div>
</div>
<div class="flex items-center gap-4 p-3 rounded-lg bg-surface-bright/10 hover:bg-surface-bright/30 transition-colors cursor-pointer group">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center font-bold text-lg border border-surface-bright/30">SNN</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">Sky News</span>
<span class="text-xs text-tertiary">Sports Update</span>
</div>
</div>
<div class="flex items-center gap-4 p-3 rounded-lg bg-surface-bright/10 hover:bg-surface-bright/30 transition-colors cursor-pointer group">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center font-bold text-lg border border-surface-bright/30">BBC</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">BBC World</span>
<span class="text-xs text-tertiary">Documentary</span>
</div>
</div>
</div>
</div>
<!-- Bottom Controls Overlay -->
<div class="absolute bottom-safe-margin-y left-safe-margin-x right-safe-margin-x z-30">
<div class="glass-overlay rounded-xl p-8 border border-surface-bright/20 flex flex-col gap-6">
<!-- Program Info -->
<div class="flex items-end justify-between">
<div class="flex items-center gap-6">
<div class="w-20 h-20 bg-surface-container-high rounded-lg flex items-center justify-center text-2xl font-bold border border-surface-bright/30 shadow-lg">
                        GNN
                    </div>
<div>
<div class="font-headline-md text-headline-md mb-1">LIVE: Evening News</div>
<div class="font-body-md text-body-md text-tertiary">Global News Network • 8:00 PM - 9:00 PM</div>
</div>
</div>
<!-- Action Icons -->
<div class="flex gap-4">
<button class="w-12 h-12 rounded-full bg-surface-bright/20 flex items-center justify-center hover:bg-surface-bright/50 transition-colors border border-transparent">
<span class="material-symbols-outlined">subtitles</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-bright/20 flex items-center justify-center hover:bg-surface-bright/50 transition-colors border border-transparent">
<span class="material-symbols-outlined">settings_voice</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-bright/20 flex items-center justify-center hover:bg-surface-bright/50 transition-colors border border-transparent">
<span class="material-symbols-outlined">format_list_bulleted</span>
</button>
</div>
</div>
<!-- Progress Bar -->
<div class="flex items-center gap-4">
<span class="font-label-sm text-label-sm text-tertiary">45:00</span>
<div class="flex-grow h-2 bg-surface-bright/50 rounded-full relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-container w-3/4 rounded-full"></div>
</div>
<span class="font-label-sm text-label-sm text-tertiary">-15:00</span>
</div>
<!-- Play Controls -->
<div class="flex items-center justify-center gap-8">
<button class="w-16 h-16 rounded-full flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<button class="w-24 h-24 rounded-full bg-surface-container-lowest flex items-center justify-center focus-ring text-on-surface">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-16 h-16 rounded-full flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
</div>
</div>
