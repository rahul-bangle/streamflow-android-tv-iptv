<script>
        // Simple logic to handle D-pad navigation focus looping for demo purposes
        document.addEventListener('keydown', function(e) {
            const focusableElements = Array.from(document.querySelectorAll('[tabindex="0"]'));
            const currentIndex = focusableElements.indexOf(document.activeElement);
            
            // Map arrow keys to basic linear navigation just to show focus states work
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                let nextIndex = currentIndex + 1;
                if (nextIndex >= focusableElements.length) nextIndex = 0;
                focusableElements[nextIndex].focus();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                let prevIndex = currentIndex - 1;
                if (prevIndex < 0) prevIndex = focusableElements.length - 1;
                focusableElements[prevIndex].focus();
            }
        });

        // Set initial focus
        window.onload = () => {
            const initialFocus = document.querySelector('[autofocus]');
            if(initialFocus) initialFocus.focus();
        };
    </script>
